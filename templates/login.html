<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - BNC App</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #050505; background-image: radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.1) 0%, transparent 50%); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: white; }
        .auth-container { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.08); padding: 2.5rem; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); width: 100%; max-width: 380px; }
        .auth-container h2 { text-align: center; margin-top: 0; margin-bottom: 1.5rem; color: #f8fafc; font-weight: 700; letter-spacing: 1px; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: #94a3b8; font-size: 0.9rem; font-weight: 500; }
        .form-group input { width: 100%; padding: 1rem; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; box-sizing: border-box; font-family: inherit; font-size: 1rem; transition: all 0.3s; background: rgba(0,0,0,0.3); color: white; }
        .form-group input:focus { outline: none; border-color: #10b981; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1); }
        .btn { width: 100%; padding: 1rem; background: #10b981; color: #000; border: none; border-radius: 10px; font-weight: 600; font-size: 1.05rem; cursor: pointer; transition: all 0.3s; font-family: inherit; margin-top: 0.5rem; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
        .btn:hover { background: #059669; transform: translateY(-2px); }
        .links { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #94a3b8; }
        .links a { color: #10b981; text-decoration: none; font-weight: 500; transition: color 0.3s; }
        .links a:hover { color: #34d399; text-decoration: underline; }
        .flash { padding: 12px; margin-bottom: 20px; border-radius: 8px; text-align: center; font-size: 0.9rem; }
        .flash.error { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
        .flash.success { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.3); }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>Welcome Back</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form method="POST">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
        <div class="links">
            <p>Don't have an account? <a href="{{ url_for('signup') }}">Sign up here</a></p>
        </div>
    </div>
</body>
</html>
