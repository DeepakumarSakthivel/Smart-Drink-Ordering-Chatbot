<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify OTP - BNC App</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #0f111a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: white; }
        .auth-container { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 30px rgba(0,0,0,0.5); width: 100%; max-width: 380px; text-align: center; }
        .auth-container h2 { margin-top: 0; margin-bottom: 1rem; color: #4ade80; font-weight: 600; }
        .auth-container p { color: #94a3b8; margin-bottom: 1.5rem; font-size: 0.95rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group input { width: 100%; padding: 1rem; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white; border-radius: 8px; box-sizing: border-box; font-family: inherit; font-size: 1.5rem; letter-spacing: 5px; text-align: center; transition: border-color 0.3s; }
        .form-group input:focus { outline: none; border-color: #4ade80; }
        .btn { width: 100%; padding: 0.9rem; background: #4ade80; color: #000; border: none; border-radius: 8px; font-weight: 600; font-size: 1.1rem; cursor: pointer; transition: background-color 0.3s; font-family: inherit; }
        .btn:hover { background: #22c55e; }
        .flash { padding: 12px; margin-bottom: 20px; border-radius: 8px; font-size: 0.9rem; }
        .flash.error { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid #ef4444; }
        .flash.success { background: rgba(74, 222, 128, 0.2); color: #86efac; border: 1px solid #4ade80; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>Email Verification</h2>
        <p>We sent a 6-digit code to your email.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form method="POST">
            <div class="form-group">
                <input type="text" name="otp" required placeholder="------" maxlength="6" autocomplete="off">
            </div>
            <button type="submit" class="btn">Verify Account</button>
        </form>
    </div>
</body>
</html>
